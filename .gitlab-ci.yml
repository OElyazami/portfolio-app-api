stages:
  - release

variables:
  GIT_DEPTH: 0
  GIT_STRATEGY: clone
  APP_ENV: prod
  SYMFONY_ENV: prod
  COMPOSER_ALLOW_SUPERUSER: "1"

semantic_release:
  stage: release
  image: node:22
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
      when: always
  variables:
    GITLAB_TOKEN: $GITLAB_TOKEN
  before_script:
    - git config --global user.email "ci@gitlab.com"
    - git config --global user.name "GitLab CI"
    - git remote set-url origin "https://oauth2:${GITLAB_TOKEN}@gitlab.com/${CI_PROJECT_PATH}.git"
    - git checkout dev
    - git pull origin dev
  script:
    # Use pipe for multi-line script
    - |
      if [ ! -f "package-lock.json" ]; then
        echo "package-lock.json missing, generating..."
        npm install
      else
        echo "package-lock.json exists, using npm ci..."
        npm ci
      fi
    - npx semantic-release --debug --no-ci

debug_semantic_release:
  stage: release
  image: node:22
  script:
    - |
      echo "=== COMPREHENSIVE DEBUG ==="
      echo ""
      
      # 1. Check Git state
      echo "1. GIT STATE:"
      git status
      echo ""
      echo "Branches:"
      git branch -a
      echo ""
      echo "Tags:"
      git tag -l
      echo ""
      echo "Latest commits:"
      git log --oneline -5
      echo ""
      
      # 2. Check package.json
      echo "2. PACKAGE.JSON:"
      cat package.json
      echo ""
      
      # 3. Check .releaserc
      echo "3. .RELEASERC:"
      cat .releaserc
      echo ""
      
      # 4. Check npm packages
      echo "4. NPM PACKAGES:"
      npm list --depth=0 2>/dev/null || echo "npm list failed"
      echo ""
      
      # 5. Try semantic-release with maximum debug
      echo "5. SEMANTIC-RELEASE DRY RUN:"
      npx semantic-release --dry-run --no-ci --debug 2>&1 | tail -100 || echo "Dry run failed"
  rules:
    - when: manual