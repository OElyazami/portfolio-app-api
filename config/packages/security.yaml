security:

  password_hashers:
    Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'
    App\Entity\User: 'auto'
  
  providers:
    app_user_provider:
      id: App\Security\UserProvider
  
  firewalls:
    dev:
      pattern: ^/(_(profiler|wdt)|css|images|js)/
      security: false
    
    api_login:
      pattern: ^/api/auth/login
      stateless: true
      json_login:
        check_path: /api/auth/login
        username_path: email
        password_path: password
        success_handler: App\Security\AuthenticationSuccessHandler
        failure_handler: App\Security\AuthenticationFailureHandler
    
    api:
      pattern: ^/v1
      stateless: true
      custom_authenticators:
        - App\Security\JwtAuthenticator
      entry_point: App\Security\JwtAuthenticator
  
  access_control:
    # Public endpoints
    - { path: ^/api/auth/register, roles: PUBLIC_ACCESS }
    - { path: ^/api/auth/login, roles: PUBLIC_ACCESS }
    
    # Protected ALL /v1 endpoints (except login/register above)
    - { path: ^/v1, roles: ROLE_USER }
    
    # Optional: Admin-only endpoints under /v1/admin
    - { path: ^/v1/admin, roles: ROLE_ADMIN }
    
    # Admin interface
    - { path: ^/admin, roles: ROLE_ADMIN }